{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4 fw-bold">📊 Dashboard</h2>

<div class="dashboard">

    <div class="card total">
        <h3>📋 Total</h3>
        <p>{{ total_tasks }}</p>
    </div>

    <div class="card completed">
        <h3>✅ Concluídas</h3>
        <p>{{ completed_tasks }}</p>
    </div>

    <div class="card pending">
        <h3>⏳ Pendentes</h3>
        <p>{{ pending_tasks }}</p>
    </div>

    <div class="card late">
        <h3>🔴 Atrasadas</h3>
        <p>{{ late_tasks }}</p>
    </div>

</div>

<div class="mt-4">
    <h3 class="mb-3">📈 Progresso Geral</h3>
    <div class="progress-bar">
        <div class="progress" style="width: {{ progress }}%;"></div>
    </div>
    <p class="mt-2 fw-semibold" style="color: var(--text-muted);">{{ progress }}% concluído</p>
</div>

{% endblock %}
